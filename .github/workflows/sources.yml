name: sources

# Issue #25: download the seed, fetch the documentation pages it links to for
# the in-scope issues, and print the manifest. Cleaned page text stays in the
# runner and is never uploaded or committed (ADR 0005). No paid model is called.

on:
  pull_request:
    paths:
      - app/knowledge/sources.py
      - knowledge/sources/curated.yml
      - .github/workflows/sources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    name: sources (fetch and manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Download the seed
        run: python -m app.knowledge.seed

      - name: Fetch the sources
        run: python -m app.knowledge.sources

      - name: Show the manifest
        run: |
          echo "=== BEGIN knowledge/sources/manifest.json"
          cat knowledge/sources/manifest.json
          echo "=== END knowledge/sources/manifest.json"
